name: ${COMPOSE_PROJECT_NAME:-relay}
services:
  app:
    init: true
    build:
      context: .
      dockerfile: deploy/local/Dockerfile
      args:
        # Space-separated npm packages for engine CLIs the bots use (e.g. an
        # opencode CLI for the opencodeGo instance). Empty by default; the
        # operator sets it to match the configured models. No default CLIs are
        # baked in because unused engines are pure image weight.
        ENGINES: ${RELAY_ENGINES:-}
    image: ${RELAY_LOCAL_IMAGE:-relay-local:latest}
    restart: unless-stopped
    volumes:
      - data:/data
    ports:
      - "${RELAY_BIND_ADDRESS:-127.0.0.1}:${RELAY_HTTP_PORT:-8080}:80"
      # Public edge: container Caddy terminates TLS for RELAY_HTTPS_HOST
      # (auto-issued cert via DNS + HTTP-01 on :80). The harness/BFF stay
      # loopback-only behind it — see the bind-address guard on caddy below.
      - "80:80"
      - "443:443"
    env_file:
      - .env
      - .env.secrets
      # The harness monitor holds the worker capability to arm captures; the app
      # must never hold the ingest capability (that is tools + scribe only).
      - .env.scribe
    environment:
      RELAY_PORT: "8799"
      RELAY_WEBHOOK_PORT: "8800"
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:-http://localhost:${RELAY_HTTP_PORT:-8080}}
      RELAY_WEBHOOK_PUBLIC_URL: ${RELAY_WEBHOOK_PUBLIC_URL:-${RELAY_PUBLIC_URL:-http://localhost:${RELAY_HTTP_PORT:-8080}}}
      # The Tool Layer runs as its own service; localhost here would point at
      # this container, not at it.
      RELAY_TOOL_URL: http://tools:8787
      # The BFF's /api/internal Gmail/Calendar routes are capability-gated;
      # bind its container interface so the separate tools container can reach
      # them over the compose network. The port is never published.
      RELAY_BFF_HOST: "0.0.0.0"
      # The harness's /api/internal routes (scribe join) are likewise
      # capability-gated; bind its container interface for the same reason.
      # The port is never published.
      RELAY_HARNESS_HOST: "0.0.0.0"
      # Relay's own shared Gmail account. Set both in .env to enable the
      # shared mailbox (BFF resolution + the harness monitor); explicit here
      # because the session store is not a durable user directory.
      RELAY_MAILBOX_ADDRESS: ${RELAY_MAILBOX_ADDRESS:-}
      RELAY_MAILBOX_USER_ID: ${RELAY_MAILBOX_USER_ID:-}
      RELAY_MAILBOX_POLL_MINUTES: ${RELAY_MAILBOX_POLL_MINUTES:-15}
      RELAY_MAILBOX_NOTIFY: ${RELAY_MAILBOX_NOTIFY:-1}
      RELAY_SCRIBE_ENABLED: ${RELAY_SCRIBE_ENABLED:-0}
      # The harness monitor arms captures by calling the worker over the compose
      # network (capability from .env.scribe, in-memory only).
      RELAY_SCRIBE_WORKER_URL: http://scribe:8791
  tools:
    init: true
    build:
      context: .
      dockerfile: deploy/local/Dockerfile
      args:
        ENGINES: ${RELAY_ENGINES:-}
    # Same image as relay (compose reuses the build); only the command differs.
    image: ${RELAY_LOCAL_IMAGE:-relay-local:latest}
    command: ["/usr/local/bin/start-tools.sh"]
    restart: unless-stopped
    volumes:
      - data:/data
    env_file:
      - .env
      - .env.secrets
      # The Tool Layer owns the transcript ingest route and holds the ingest
      # capability; it must never hold the worker capability.
      - .env.ingest
    environment:
      # Listen on the container interface so the harness can reach this
      # service over the compose network. The HMAC actor assertion stays the
      # real boundary (default loopback is for bare processes, not compose).
      RELAY_TOOL_HOST: "0.0.0.0"
      RELAY_TOOL_PORT: "8787"
      RELAY_BLADE_ROOT: /data/blade
      # Gmail/Calendar tools call the BFF's capability-gated internal routes.
      # Default is loopback, which is this container — point at `app`.
      RELAY_BFF_INTERNAL_URL: http://app:8798
      # The scribe-join tool calls the harness's capability-gated join route.
      # Same pattern: default loopback points at this container, point at `app`.
      RELAY_HARNESS_INTERNAL_URL: http://app:8799
    expose:
      - "8787"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz', { signal: AbortSignal.timeout(4000) }).then(async r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  # Scribe: joins relay@'s meetings, captures per-channel audio, transcribes via
  # the shared `stt` service, and writes rows through the Tool Layer ingest
  # route. Holds only .env.scribe (its endpoint capability) and .env.ingest
  # (the ingest capability) — never the BFF secrets. Signed-in profile + spool
  # + failures + probes persist on scribe_data (mounted ONLY here). No published
  # ports: the harness reaches it over the compose network.
  scribe:
    init: true
    build:
      context: .
      dockerfile: deploy/local/Dockerfile.scribe
    image: ${RELAY_SCRIBE_IMAGE:-relay-scribe:latest}
    restart: unless-stopped
    env_file:
      - .env.ingest
      - .env.scribe
    environment:
      RELAY_SCRIBE_HOST: "0.0.0.0"
      RELAY_SCRIBE_PORT: "8791"
      RELAY_SCRIBE_PROFILE_DIR: /data/scribe/profile
      RELAY_SCRIBE_DATA_DIR: /data/scribe
      RELAY_SCRIBE_PROBE_DIR: /data/scribe/probes
      RELAY_STT_URL: http://stt:8090
      RELAY_INGEST_URL: http://tools:8787/internal/transcripts
      # Join policy: 2 captures max (a third meeting becomes a `failed`
      # "at capacity" row with a notice, never a silent drop).
      RELAY_SCRIBE_MAX_CONCURRENT: ${RELAY_SCRIBE_MAX_CONCURRENT:-2}
      RELAY_SCRIBE_MAX_STREAMS: ${RELAY_SCRIBE_MAX_STREAMS:-12}
      RELAY_SCRIBE_SELF_NAME: ${RELAY_SCRIBE_SELF_NAME:-Relay Scribe}
      # One-line disclosure posted to the Meet chat once after admission; empty
      # disables it. Best-effort (a UI-drift failure never fails the capture).
      RELAY_SCRIBE_DISCLOSURE: "${RELAY_SCRIBE_DISCLOSURE:-This meeting is transcribed by Relay AI.}"
      # Headful under Xvfb (the image + start-scribe.sh provide it): Zoom walls
      # a headless browser even with a signed-in profile.
      RELAY_SCRIBE_HEADLESS: ${RELAY_SCRIBE_HEADLESS:-0}
      RELAY_SCRIBE_ENABLED: ${RELAY_SCRIBE_ENABLED:-0}
    volumes:
      - scribe_data:/data
    expose:
      - "8791"
    depends_on:
      stt:
        condition: service_healthy
      tools:
        condition: service_healthy
    # CPU is the tighter limit (2 vCPU shared with STT + Chrome video decode);
    # the memory cap bounds a runaway Chrome. Measure before raising concurrency.
    mem_limit: ${RELAY_SCRIBE_MEM_LIMIT:-4g}
    pids_limit: 2048
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8791/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  # Shared STT server (§6.6): one process serves every capture bot. Model loaded
  # once; the worker speaks only the HTTP contract. Reached over the compose
  # network; no published ports.
  stt:
    init: true
    build:
      context: .
      dockerfile: deploy/local/Dockerfile.stt
    image: ${RELAY_STT_IMAGE:-relay-stt:latest}
    restart: unless-stopped
    environment:
      RELAY_STT_HOST: "0.0.0.0"
      RELAY_STT_PORT: "8090"
      RELAY_STT_MODEL_DIR: /models/parakeet
      RELAY_STT_THREADS: ${RELAY_STT_THREADS:-2}
    expose:
      - "8090"
    # Parakeet int8 sits ~1.1 GB resident; headroom for concurrent streams.
    mem_limit: ${RELAY_STT_MEM_LIMIT:-3g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8090/health', timeout=4)"]
      interval: 20s
      timeout: 5s
      start_period: 40s
      retries: 5

  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    network_mode: service:app
    environment:
      RELAY_HTTPS_HOST: ${RELAY_HTTPS_HOST:-}
      RELAY_BIND_ADDRESS: ${RELAY_BIND_ADDRESS:-127.0.0.1}
    command:
      - /bin/sh
      - -ec
      - |
        export RELAY_UPSTREAM_SCHEME=http
        export RELAY_SITE=":80"
        if [ -n "$$RELAY_HTTPS_HOST" ] && [ "$$RELAY_BIND_ADDRESS" != "127.0.0.1" ]; then
          echo "RELAY_HTTPS_HOST requires RELAY_BIND_ADDRESS=127.0.0.1; forward HTTPS through a trusted local proxy." >&2
          exit 1
        fi
        if [ -n "$$RELAY_HTTPS_HOST" ]; then
          export RELAY_UPSTREAM_SCHEME=https
          export RELAY_SITE="$$RELAY_HTTPS_HOST"
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  data:
    external: ${RELAY_DATA_EXTERNAL:-false}
    name: ${RELAY_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-relay}_data}
  # Scribe-only: the signed-in relay@ browser profile is a full Google session,
  # so it must never be mounted into app/tools. Also holds spool/failures/probes.
  scribe_data:
    name: ${RELAY_SCRIBE_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-relay}_scribe_data}
  caddy_data:
  caddy_config:
