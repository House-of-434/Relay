name: ${COMPOSE_PROJECT_NAME:-openmausbot}
services:
  omb:
    init: true
    build:
      context: .
      dockerfile: deploy/local/Dockerfile
      args:
        # Space-separated npm packages for engine CLIs the bots use (e.g. an
        # opencode CLI for the opencodeGo instance). Empty by default; the
        # operator sets it to match the configured models. No default CLIs are
        # baked in because unused engines are pure image weight.
        ENGINES: ${OMB_ENGINES:-}
    image: ${OMB_LOCAL_IMAGE:-openmausbot-local:latest}
    restart: unless-stopped
    volumes:
      - data:/data
    ports:
      - "${OMB_BIND_ADDRESS:-127.0.0.1}:${OMB_HTTP_PORT:-8080}:80"
    env_file:
      - .env
      - .env.secrets
    environment:
      OMB_PORT: "8799"
      OMB_WEBHOOK_PORT: "8800"
      OMB_PUBLIC_URL: ${OMB_PUBLIC_URL:-http://localhost:${OMB_HTTP_PORT:-8080}}
      OMB_WEBHOOK_PUBLIC_URL: ${OMB_WEBHOOK_PUBLIC_URL:-${OMB_PUBLIC_URL:-http://localhost:${OMB_HTTP_PORT:-8080}}}
      # The Tool Layer runs as its own service; localhost here would point at
      # this container, not at it.
      RELAY_TOOL_URL: http://tools:8787
  tools:
    init: true
    build:
      context: .
      dockerfile: deploy/local/Dockerfile
      args:
        ENGINES: ${OMB_ENGINES:-}
    # Same image as omb (compose reuses the build); only the command differs.
    image: ${OMB_LOCAL_IMAGE:-openmausbot-local:latest}
    command: ["/usr/local/bin/start-tools.sh"]
    restart: unless-stopped
    volumes:
      - data:/data
    env_file:
      - .env
      - .env.secrets
    environment:
      # Listen on the container interface so the harness can reach this
      # service over the compose network. The HMAC actor assertion stays the
      # real boundary (default loopback is for bare processes, not compose).
      RELAY_TOOL_HOST: "0.0.0.0"
      RELAY_TOOL_PORT: "8787"
      RELAY_BLADE_ROOT: /data/blade
    expose:
      - "8787"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz', { signal: AbortSignal.timeout(4000) }).then(async r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    network_mode: service:omb
    environment:
      OMB_HTTPS_HOST: ${OMB_HTTPS_HOST:-}
      OMB_BIND_ADDRESS: ${OMB_BIND_ADDRESS:-127.0.0.1}
    command:
      - /bin/sh
      - -ec
      - |
        export OMB_UPSTREAM_SCHEME=http
        if [ -n "$$OMB_HTTPS_HOST" ] && [ "$$OMB_BIND_ADDRESS" != "127.0.0.1" ]; then
          echo "OMB_HTTPS_HOST requires OMB_BIND_ADDRESS=127.0.0.1; forward HTTPS through a trusted local proxy." >&2
          exit 1
        fi
        if [ -n "$$OMB_HTTPS_HOST" ]; then
          export OMB_UPSTREAM_SCHEME=https
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      omb:
        condition: service_healthy
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  data:
    external: ${OMB_DATA_EXTERNAL:-false}
    name: ${OMB_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-openmausbot}_data}
  caddy_data:
  caddy_config:
