name: Docker image

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - deploy/local/**
      - .dockerignore
      - compose.yaml
      - server/**
      - services/**
      - shared/**
      - packages/**
      - src/**
      - scripts/bundle-server.mjs
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - deploy/local/**
      - .dockerignore
      - compose.yaml
      - .github/workflows/docker.yml

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: build image + boot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        env:
          ENGINES:
        run: docker compose build
      - name: Boot the compose stack and prove omb answers
        env:
          ENGINES:
        run: |
          set -euo pipefail
          cp .env.example .env
          touch .env.secrets
          docker compose up -d
          for i in $(seq 1 40); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' openmausbot-omb-1 2>/dev/null)" = healthy ]; then break; fi
            sleep 5
            if [ "$i" = "40" ]; then docker compose logs omb; echo "omb never became healthy"; exit 1; fi
          done
          # the renderer is served by Caddy from the harness (OMB_STATIC_DIR)
          docker compose exec -T omb curl -sf http://127.0.0.1:8799/ | grep -qi "<html" || { docker compose logs omb; echo "UI not served"; exit 1; }
          curl -sf http://127.0.0.1:8080/api/health
          docker compose logs omb | tail -5
      - name: Prove the harness never binds a public interface
        # The loopback-trust model is the auth model, so the harness must keep
        # the server unreachable from the container's own network. Probe from a
        # sibling container on the same compose network; a positive control
        # first proves the probe can see a socket that does bind 0.0.0.0.
        run: |
          set -euo pipefail
          net=$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' openmausbot-omb-1 | awk '{print $1}')
          test -n "$net"
          probe() { docker run --rm --network "$net" curlimages/curl:8.14.1 -s --max-time 3 "http://$1:$2/" >/dev/null; }
          docker run -d --name leaky --entrypoint node openmausbot-local:latest -e "require('http').createServer((q,s)=>s.end('leak')).listen(8799,'0.0.0.0')"
          sleep 2
          leaky_ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' leaky | awk '{print $1}')
          test -n "$leaky_ip"
          probe "$leaky_ip" 8799 || { echo "probe cannot see a 0.0.0.0 listener; the check would be vacuous"; exit 1; }
          docker rm -f leaky >/dev/null
          ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' openmausbot-omb-1 | awk '{print $1}')
          test -n "$ip"
          if probe "$ip" 8799 || probe "$ip" 8800; then
            echo "server answered on $ip — it must only bind 127.0.0.1"; exit 1
          fi
          echo "unreachable on $ip: loopback-only holds"
      - name: Prove the Tool Layer fails closed without database settings
        # No secrets exist in CI, so tools cannot go healthy here. The contract
        # under test is fail-closed: missing settings refuse with the exact
        # setting name, never silence and never a partial boot.
        run: |
          set -euo pipefail
          docker compose logs tools | grep -q "Required Tool Layer setting RELAY_DB_URL is missing" || {
            docker compose logs tools | tail -20
            echo "tools did not fail closed on missing settings"
            exit 1
          }
          docker compose down -v

  publish:
    name: publish to GHCR
    # Release dispatches on its published tag because GITHUB_TOKEN-created
    # tags do not start another workflow. A manual branch run is smoke-only.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/local/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
